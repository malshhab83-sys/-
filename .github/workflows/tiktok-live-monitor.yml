name: TikTok LIVE Monitor

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tiktok-live-monitor.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: tiktok-live-monitor-oiiim1
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TikTok LIVE checker
        run: python -m pip install --disable-pip-version-check --quiet TikTokLive

      - name: Check @oiiim1 LIVE status
        id: check
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import os
          from TikTokLive import TikTokLiveClient

          USERNAME = "@oiiim1"

          async def main():
              output = os.environ["GITHUB_OUTPUT"]
              try:
                  client = TikTokLiveClient(unique_id=USERNAME)
                  is_live = await client.is_live()
                  status = "live" if is_live else "offline"
                  print(f"{USERNAME}: {status}")
              except Exception as exc:
                  status = "error"
                  print(f"TikTok status check failed: {type(exc).__name__}: {exc}")

              with open(output, "a", encoding="utf-8") as f:
                  f.write(f"status={status}\n")

          asyncio.run(main())
          PY

      - name: Notify once per LIVE session
        if: steps.check.outputs.status != 'error'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_USER: "@oiiim1"
          ALERT_TITLE: "🔴 TikTok LIVE: @oiiim1"
          ASSIGNEE: "malshhab83-sys"
          STATUS: ${{ steps.check.outputs.status }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            ALERT_TITLE="🧪 اختبار تنبيه TikTok LIVE"
            STATUS="live"
          fi

          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            | python -c 'import json, os, sys; xs=json.load(sys.stdin); title=os.environ.get("ALERT_TITLE", ""); print(next((str(x["number"]) for x in xs if x["title"] == title), ""))')"

          if [ "$STATUS" = "live" ]; then
            if [ -z "$existing" ]; then
              if [ "$EVENT_NAME" = "push" ]; then
                gh issue create \
                  --repo "$GITHUB_REPOSITORY" \
                  --title "$ALERT_TITLE" \
                  --assignee "$ASSIGNEE" \
                  --body "هذا **اختبار مؤقت** للتأكد أن تنبيهات المراقب تصل إلى بريدك. ليس معناه أن @oiiim1 يبث الآن."
              else
                gh issue create \
                  --repo "$GITHUB_REPOSITORY" \
                  --title "$ALERT_TITLE" \
                  --assignee "$ASSIGNEE" \
                  --body "الحساب **$TARGET_USER** ظهر الآن في بث TikTok LIVE.\n\nافتح البث: https://www.tiktok.com/$TARGET_USER/live\n\nالمراقب يفحص الحالة كل 5 دقائق تقريبًا."
              fi
            else
              echo "Alert already open as issue #$existing; no duplicate notification."
            fi
          elif [ "$STATUS" = "offline" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "البث غير متاح الآن. تم إعادة تسليح المراقب وسيصدر تنبيه جديد عند LIVE القادم."
            else
              echo "Offline and already armed."
            fi
          fi
